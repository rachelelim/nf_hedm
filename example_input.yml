analysis_name: V-Y-2_S0_L1 # The name you want all your output files to have within thier filename (relevant to the sample)

main_directory: "./" # Starting path for detector and materials file, if None this will default to working directory.
output_directory: "./" # Path to save all output files, if None this will default to main_directory

input_files:
  detector_file: "../../retiga_V-Y-2.yml" # Your detector file, if full path is not provided, will default to looking in main_directory
  materials_file: "../../materials.h5" # Your materials file, if full path is not provided, will default to looking in main_directory
  #grains_out_file: "init_V-Y-2_Nov2025_S000_master.out" # Your grains.out file, if full path is not provided, will default to looking in main_directory
  grains_out_file: "V-Y-2_init_dream3d_Nov2025_S000_master.out"
# Do you want plots to show?
output_plot_check: True #False

experiment:
  # Incoming beam information
  beam_energy: 51.998 # keV
  beam_vertical_span: [-0.1, 0.1] # mm

  # Material information
  material_name: V # Must be a material name stored in your materials file
  point_group_number: 32 # Note: this is point group not space group - check nfutil for list
  max_tth: None # Degrees or None - Will clip tth

  # Completness and chi^2 thesholds to trim the quality of fitted grains from the grains.out file
  comp_thresh: 0.5 # Value [0.0 1.0] or None to ignore completness
  chi2_thresh: 0.1 # Value [0.0 1.0] or None to ignore chi^2

  images_and_omegas:
    # Omega handling - omega edges will be automatically searched for, if they are not found the below start and stop will be used
    # and an even omega spacing will be generated
    omega_start: 0.0 # Degrees
    omega_stop: 360.0 # Degrees
    omega_correction: 0.22 #-0.3125 #-0.35 # Degrees (float) to shift images postive or negative through omega

  # Brute force voxelwise orientation refinement - method not suggested
  # Set to true for missing grains, bound should be about half the orientation spacing

tomography:
  # If you are running tomography in CHAP then none of this section will be used
  # Load images and process tomography mask (depreciated version)
  img_stem: nf_
  num_digits: 5
  bright:
    folder: /nfs/chess/raw/2017-2/f2/rollett-628-1/ti7-1/7/nf/ #defaults to data_folder
    img_start: 62
    num_imgs: 50
  dark:
    folder: /nfs/chess/raw/2017-2/f2/rollett-628-1/ti7-1/6/nf/ #defaults to data_folder
    img_start: 6
    num_imgs: 50
  images:
    folder: /nfs/chess/raw/2017-2/f2/rollett-628-1/ti7-1/8/nf/
    img_start: 118
    num_imgs: 3600
  ome_start: 0.0 #degrees
  ome_end: 359.75

  #Don't change these unless you know what you are doing, this will close small holes
  #and remove noise
  processing:
    recon_thresh: 0.0002 #usually varies between 0.0001 and 0.0005
    noise_obj_size: 500
    min_hole_size: 500
    erosion_iter: 1
    dilation_iter: 1

NF_images:
  # Sample raw data directory - could be of the form: '/nfs/chess/raw/[cycle ID]/[beamline]/BTR/sample'
  sample_raw_data_folder: "/p/lustre2/lim37/lim-4252-a/V-Y-2/"

  image_loading:
    style: direct # par, direct, or imageseries
    # A metadata file (.par and .json) will be looked for by default
    # If none is found images will be loaded directly
    # Metadata Paramters
    json_and_par_starter: "id3a-rams2_nf*"
    target_vertical_position: -0.3 # At what position along the rotation axis was this data taken?  This defines what set of scans is pulled from the metadata.
    vertical_motor_name: "ramsz" # What is the name of the motor used to translate the sample along the rotation axis?

    # Load images directly (depricated)
    data_folders: [14]
    stem: nf_
    stem_digits: 6
    goodstarts: [50730]
    nframes_per_folder: 1441

    # Load an h5
    #raw_imageseries_path: '/nfs/chess/user/seg246/software/MechVD/output/fcc_fe_nf_v02_output_data.h5'

  # Image cleaning routine
  processing:
    # Dynamic darkfield generation
    omega_kernel_size: 50 # Frames - 10 degs worth of frames is a good place to start

    # Global image threshold
    threshold: 0 # Applied as uint in addition to darkfield

    # Which routine to use - Only the parameters for chosen routine will be pulled
    routine_choice: 1 # 0 = gaussian blurring, 1 = dilation/errosion, 2 = non-local means, None does not binarize

    # Gaussian Cleaning Parameters
    sigma: 1.5 # Larger values begin to rapidly blur images
    gaussian_binarization_threshold: 1.3 # Images are floats when this is applied

    # Erosion/Dilation Parameters
    num_errosions: 2 # General practice, num_errosions >= num_dilations
    num_dilations: 3
    erosion_dilation_binarization_threshold: 6 # Images are uints when this is applied

    # Non-Local Means Cleaning Parameters
    patch_size: 10
    patch_distance: 15
    NLM_binarization_threshold: 1.35 # Images are floats when this is applied

    # Median Cleaning Parameters
    median_filter_size: 6

    # Small object removal
    small_object_size: 100 # Number of pixels or None to remove nothing

    # Omega dilation
    dilate_omega: 1 # 0 or 1 - Dilate the binarized image stack in omega

NF_reconstruction:
  tomography:
    mask_filepath: ../tomo/V-Y-2_init_tomo_clean.npz ## Absolute path or leave empty to not use a mask
    use_single_layer: False # True uses the center mask layer for all vertical positions
    vertical_motor_position: 0.2 # mm - What is the vertical motor's position?

  cross_sectional_dimensions: 1.5 # mm
  voxel_spacing: 0.005 # mm - cubic voxel size for reconstruction
  desired_vertical_span: [-0.1, 0.1] #[-0.01,  0.01] # mm - span of vertical space to reconstruct

  beam_stop:
    beam_stop_filepath: # Path or leave blank to generate beam_stop with parameters
    # Below parameters will only be used if beam_stop_filepath: None
    beam_stop_vertical_center: 0.0 # mm - Measured from the origin of the detector paramters
    beam_stop_vertical_span: 0.3 # mm - Total span of the beam stop vertically

  misorientation: # You really don't want to be doing this... -REL
    use_misorientation: True # Did you mean False?  You probably meant False... -SEG
    bound: 0.1 # Degrees
    spacing: 0.1 # Degrees (will not be used if bound = 0.0)
    # Example: bound = 0.5, spacing = 0.25 will produce [-0.5, -0.25, 0.0, 0.25, 0.5]

  missing_grains:
    # Data path to .npz of reconstructed data
    reconstructed_data_path: "V-Y-2_S0_L1_grain_map_data.npz"
    # Spacing between orientations used in serach
    ori_grid_spacing: 1.0 # Degrees - 1.0 is a good place to start
    # Where to look for new grains?
    confidence_threshold: 0.5 # Anything less than this will be looked at for new grains
    low_confidence_sparsing: 2 # 0 will take all voxels, 1 will take about half, 2 about a quarter - uses a sparse regular grid - Up to you, 0 has the best chance of finding all missing grains
    errode_free_surface: 1 # NF is poor at the surface already, removes the free surface of your tomo mask from the search space - 1 is suggested
    # Define a cutoff value for when to switch to a brute force
    coord_cutoff_scale: 0.15 # Once we only have coord_cutoff_scale*100 % voxels left to look at we transition to brute search of each voxel - its quicker - 0.15 is good
    iter_cutoff: 50 # If we don't find a grain after iter_cutoff iterations we break and go straight to searching all voxels - 10 is good but you may need more if you have a poor starting reconstruction
    # Re-rerun and save reconstruction
    re_run_and_save: 0 # If 1 this will re-run the full reconstruction with all grains and save an npz + paraview file (else put 0)

multiprocessing:
  num_cpus: -1 # Number of threads to use [all = os.cpu_count(), half = os.cpu_count()/2 (default), negative number = os.cpu_count()-num, positive number = num]
  chunk_size: -1 # Use -1 if you wish automatic chunk size calculation
  # RAM_set: True  # if True, manually set max amount of ram
  # max_RAM: 256  # only used if RAM_set is true. in GB
  check: None
  limit: None
  generate: None
